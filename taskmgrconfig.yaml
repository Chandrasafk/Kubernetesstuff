apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskmanager
  labels:
    app: taskmanager
spec:
  replicas: 2
  selector:
    matchLabels:
      app: taskmanager
  template:
    metadata:	
      labels:
        app: taskmanager
    spec:
      containers:
        - name: taskmanager
          image: chandrassh/dockerstuff-taskmanager:latest
          ports:
            - containerPort: 8000
          env:
            - name: DB_HOST
              value: "your-rds-endpoint"
            - name: DB_USER
              value: "admin"
            - name: DB_PASSWORD
              value: "admin123"
          
---

apiVersion: v1
kind: Service
metadata:
  name: taskmanager
spec:
  type: ClusterIP
  selector:
    app: taskmanager
  ports:
    - port: 8000
      targetPort: 8000

